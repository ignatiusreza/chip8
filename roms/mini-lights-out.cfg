title = Mini Lights Out
author = tobiasvl
about = Turn off all the lights in the 4x4 grid. Pressing a light toggles it and its four neighbours, wrapping around the edges.
about = Only lights that are on can be pressed. The full rules are in the archive: src/mini-lights-out/README.md.
controls = 1 2 3 4 / Q W E R / A S D F / Z X C V: press the light in the same spot of the grid
speed = 7
