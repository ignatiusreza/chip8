# from the Chip8 Community Archive, CC0
title = Space Racer
author = WilliamDonnelly
about = 2 players: move your ship up through the starfield without hitting the stars, for a point per crossing.
about = Play until the timer lines at the bottom run out; the high score wins. The keys are shown before the race.
controls = Any key: move on to the next screen
controls = Q: close the instructions
controls = Q / A: player 1 (left) up / down
controls = R / F: player 2 (right) up / down
speed = 20
