[package]
name = "chip8-server"
version = "0.1.0"
edition = "2021"
description = "Serves the web player and relays shared sessions to people watching"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
chip8 = { path = "../../rust", default-features = false }
futures-util = "0.3"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "net", "signal"] }
tower-http = { version = "0.6", features = ["fs"] }

[dev-dependencies]
tokio-tungstenite = "0.26"
